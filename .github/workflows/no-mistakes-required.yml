name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Verify no-mistakes signature and pipeline attestation
        id: attestation
        continue-on-error: true
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@32d396ac0f29135daf7fcb9964aba9d5f4e796d6 # post-v1.57.1, untagged (action added in #819)

      - name: Accept no-mistakes gate commits when the body carries no signature
        if: steps.attestation.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
        run: |
          set -eu
          marker='Updates from [git push no-mistakes](https://github.com/kunchenguid/no-mistakes)'
          # A body carrying the signature is decided on that body alone. The
          # shared action above already judged its attestation and rejected it,
          # so a gate-written commit must not quietly stand in for the proof
          # the body itself claims to carry.
          if printf '%s' "${PR_BODY:-}" | grep -qF -- "$marker"; then
            {
              echo "::error::The no-mistakes signature in PR #${PR_NUMBER} carries no valid pipeline step attestation."
              echo
              echo "The shared gate action reported why above. A body that carries the"
              echo "signature is judged on that body alone, so the gate-commit proof below"
              echo "does not apply to it."
              echo
              echo "Re-run the pipeline with 'git push no-mistakes' so the attestation is"
              echo "written against this PR's current head."
              echo "See CONTRIBUTING.md for setup and the full workflow."
              echo
              echo "PR author: ${PR_AUTHOR}"
            } >&2
            exit 1
          fi
          # The gate does not always get to open the PR itself. When its push
          # target is rejected (an unset fork URL against a repository the
          # author cannot push to is the known case), the branch reaches the
          # remote by hand and the body carries no signature even though every
          # pipeline step ran on the change. The commits the gate writes are the
          # same proof by a different route, so accept a `no-mistakes(<step>):`
          # subject on any commit in the PR. That is no weaker than the body
          # marker: both are deterministic pipeline output rather than something
          # only the pipeline can produce.
          subjects=$(gh api --paginate "repos/${PR_REPO}/pulls/${PR_NUMBER}/commits" \
            --jq '.[].commit.message | split("\n")[0]') || {
            echo "::error::Could not read the commits of PR #${PR_NUMBER}, so the gate-commit proof was not evaluated." >&2
            exit 1
          }
          if printf '%s\n' "$subjects" | grep -qE '^no-mistakes\([a-z-]+\): '; then
            echo "Found no-mistakes gate commits in PR #${PR_NUMBER}."
            exit 0
          fi
          {
            echo "::error::This PR was not raised through no-mistakes."
            echo
            echo "Contributions to this repository must be submitted via 'git push no-mistakes'."
            echo "That pipeline runs the required review/test/lint/CI steps and writes a"
            echo "deterministic '## Pipeline' section into the PR body containing:"
            echo
            echo "    $marker"
            echo
            echo "Neither proof was found: the body carries no signature, and no commit"
            echo "on this PR has a 'no-mistakes(<step>):' subject."
            echo
            echo "See CONTRIBUTING.md for setup and the full workflow."
            echo
            echo "PR author: ${PR_AUTHOR}"
          } >&2
          exit 1
